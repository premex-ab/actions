---
name: Test S3 Artifact Actions

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  round-trip:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Round trip (${{ matrix.os }})
    env:
      S3_TEST_ENDPOINT: http://127.0.0.1:5055
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # moto with IAM enabled checks every request's SigV4 signature,
      # like a real store.
      - name: Start a local S3-compatible server
        id: s3
        run: |
          pip install --quiet 'moto[server]' boto3
          INITIAL_NO_AUTH_ACTION_COUNT=3 nohup moto_server -p 5055 \
            > "$RUNNER_TEMP/moto.log" 2>&1 &
          # Wait with a bare TCP connect: an HTTP probe would use up one of the
          # three unsigned calls setup_s3.py needs.
          python -c 'import socket, time
          for _ in range(30):
              try:
                  socket.create_connection(("127.0.0.1", 5055), 1).close()
                  break
              except OSError:
                  time.sleep(1)'
          python .github/s3-test/setup_s3.py

      # Every review finding, run with Apple's /bin/bash 3.2 on macOS.
      - name: Edge cases
        env:
          S3_TEST_KEY_ID: ${{ steps.s3.outputs.access-key-id }}
          S3_TEST_SECRET: ${{ steps.s3.outputs.secret-access-key }}
          TEST_BASH: ${{ runner.os == 'macOS' && '/bin/bash' || 'bash' }}
        run: $TEST_BASH .github/s3-test/edge-cases.sh

      - name: Create files to upload
        run: |
          mkdir -p fixture/build/outputs/bundle "fixture/docs/with space"
          head -c 5000000 /dev/urandom > fixture/build/outputs/bundle/app.aab
          echo listing > "fixture/docs/with space/listing.md"
          echo ignored > fixture/ignored.txt

      - name: Upload
        id: upload
        uses: ./s3-upload-artifact
        with:
          name: bundle
          working-directory: fixture
          path: |
            build/outputs/bundle/*.aab
            docs/with space
          endpoint: ${{ env.S3_TEST_ENDPOINT }}
          bucket: ci-artifacts
          access-key-id: ${{ steps.s3.outputs.access-key-id }}
          secret-access-key: ${{ steps.s3.outputs.secret-access-key }}

      - name: Download
        id: download
        uses: ./s3-download-artifact
        with:
          name: bundle
          path: downloaded
          sha256: ${{ steps.upload.outputs.sha256 }}
          endpoint: ${{ env.S3_TEST_ENDPOINT }}
          bucket: ci-artifacts
          access-key-id: ${{ steps.s3.outputs.access-key-id }}
          secret-access-key: ${{ steps.s3.outputs.secret-access-key }}

      - name: Check the round trip
        env:
          UPLOADED: ${{ steps.upload.outputs.sha256 }}
          DOWNLOADED: ${{ steps.download.outputs.sha256 }}
        run: |
          test "$UPLOADED" = "$DOWNLOADED"
          cmp fixture/build/outputs/bundle/app.aab \
            downloaded/build/outputs/bundle/app.aab
          cmp "fixture/docs/with space/listing.md" \
            "downloaded/docs/with space/listing.md"
          test ! -e downloaded/ignored.txt

      - name: A wrong secret is refused
        id: wrong-secret
        continue-on-error: true
        uses: ./s3-download-artifact
        with:
          name: bundle
          path: refused
          endpoint: ${{ env.S3_TEST_ENDPOINT }}
          bucket: ci-artifacts
          access-key-id: ${{ steps.s3.outputs.access-key-id }}
          secret-access-key: not-the-secret

      - name: Tamper with the stored archive
        env:
          S3_TEST_KEY_ID: ${{ steps.s3.outputs.access-key-id }}
          S3_TEST_SECRET: ${{ steps.s3.outputs.secret-access-key }}
        run: python .github/s3-test/tamper.py "${{ steps.upload.outputs.key }}"

      - name: A tampered archive is refused
        id: tampered
        continue-on-error: true
        uses: ./s3-download-artifact
        with:
          name: bundle
          path: tampered
          endpoint: ${{ env.S3_TEST_ENDPOINT }}
          bucket: ci-artifacts
          access-key-id: ${{ steps.s3.outputs.access-key-id }}
          secret-access-key: ${{ steps.s3.outputs.secret-access-key }}

      - name: Check the refusals
        run: |
          test "${{ steps.wrong-secret.outcome }}" = failure
          test "${{ steps.tampered.outcome }}" = failure
          test ! -e tampered/build

      # Self-hosted macOS runners may only have Apple's bash 3.2 as /bin/bash.
      - name: Round trip with the system bash
        if: runner.os == 'macOS'
        env:
          S3_ENDPOINT: ${{ env.S3_TEST_ENDPOINT }}
          S3_BUCKET: ci-artifacts
          S3_ACCESS_KEY_ID: ${{ steps.s3.outputs.access-key-id }}
          S3_SECRET_ACCESS_KEY: ${{ steps.s3.outputs.secret-access-key }}
          S3_PREFIX: bash32/${{ github.run_id }}
          S3_NAME: bundle
        run: |
          /bin/bash --version | head -1
          (cd fixture && S3_PATH='build/outputs/bundle/*.aab' \
            S3_IF_NO_FILES_FOUND=error \
            /bin/bash "$GITHUB_WORKSPACE/s3-upload-artifact/upload.sh")
          S3_DESTINATION=bash32 /bin/bash s3-download-artifact/download.sh
          cmp fixture/build/outputs/bundle/app.aab \
            bash32/build/outputs/bundle/app.aab

  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - round-trip
    steps:
      - name: Check results
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
